<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Kana Typing Trainer</title>
<meta name="description" content="An offline, distraction-free typing trainer for hiragana and katakana." />
<meta name="theme-color" content="#2f7dd1" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="./style.css" />
<link rel="stylesheet" href="./juice.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Kana Typing Trainer</h1>
  </header>

  <main class="practice">
    <fieldset class="tab-group">
      <legend class="visually-hidden">Display mode</legend>
      <label class="tab">
        <input type="radio" name="display-mode" value="kana" checked />
        <span>Kana</span>
      </label>
      <label class="tab">
        <input type="radio" name="display-mode" value="kana-romaji" />
        <span>Both</span>
      </label>
      <label class="tab">
        <input type="radio" name="display-mode" value="romaji" />
        <span>Romaji</span>
      </label>
    </fieldset>

    <div class="target-area" aria-live="polite">
      <p class="empty-message" id="empty-message" hidden>
        Select at least one row below to start practicing.
      </p>
      <div class="target-cell" id="target-cell">
        <div class="juice-layer" id="juice-layer" aria-hidden="true"></div>
        <div class="target-primary" id="target-primary"></div>
      </div>
      <div class="target-secondary" id="target-secondary" hidden></div>
    </div>

    <form id="answer-form" autocomplete="off" novalidate>
      <label for="answer-input" class="visually-hidden">Type the reading for the target above</label>
      <input
        type="text"
        id="answer-input"
        name="answer"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="done"
        placeholder="Type here"
      />
      <button type="submit" class="visually-hidden" tabindex="-1">Submit answer</button>
    </form>

    <p class="feedback" id="feedback" role="status" aria-live="assertive"></p>

    <fieldset class="tab-group tab-group--small">
      <legend class="visually-hidden">Answer submission</legend>
      <label class="tab">
        <input type="radio" name="submission-mode" value="auto" checked />
        <span>Auto-check</span>
      </label>
      <label class="tab">
        <input type="radio" name="submission-mode" value="manual" />
        <span>Manual (Enter)</span>
      </label>
    </fieldset>
  </main>

  <section class="settings-panel" aria-labelledby="juice-heading">
    <span class="settings-panel__label" id="juice-heading">Game Juice</span>
    <p class="settings-panel__description">Adds enhanced visual reactions and transitions throughout typing practice.</p>
    <fieldset class="tab-group tab-group--small">
      <legend class="visually-hidden">Game Juice</legend>
      <label class="tab">
        <input type="radio" name="game-juice" value="on" />
        <span>On</span>
      </label>
      <label class="tab">
        <input type="radio" name="game-juice" value="off" />
        <span>Off</span>
      </label>
    </fieldset>
  </section>

  <section class="row-panel" aria-labelledby="rows-heading">
    <h2 id="rows-heading">Practice rows</h2>
    <div id="row-sections"></div>
  </section>
</div>

<script src="./kana-data.js"></script>
<script src="./juice.js"></script>
<script src="./app.js"></script>
</body>
</html>
